name: Verify

# 独立门禁：只在 PR 和手动触发时校验，不进入打包链路，避免重复延长出包时间。
on:
  workflow_dispatch:
# 保留手动触发：需要时可在 Actions → Verify → Run workflow 单独跑全量。
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source capability consistency
        run: |
          python3 -B scripts/generate_source_capabilities.py --check
          python3 -B scripts/test_source_capabilities.py -v
      - name: Offline media regressions
        env:
          CXX: g++
        run: |
          python3 -B android/tests/test_media_contract.py -v
          python3 -B scripts/test_media_artwork.py -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Source policy editions
        run: |
          dart scripts/check_source_capabilities.dart
          dart -DALL_SOURCES=true scripts/check_source_capabilities.dart
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      # dart analyze 只收一个目录，所以拆成两步。
      - name: Analyze lib
        run: dart analyze --fatal-infos lib
      - name: Analyze test
        run: dart analyze --fatal-infos test
      # 先不带 --coverage：flutter_tester 在覆盖率插桩下出现过
      # "Shell subprocess crashed with segmentation fault"
      # （崩在 test/download_poster_progress_test.dart，随后整个 tester 进程死掉，
      #  后面的文件全部被标成 failed after test completion）。
      # 那是崩溃而非断言失败，不该用覆盖率把门禁堵死；等测试全绿后再单独加一步。
      # 全量递归发现测试；历史失败也执行，不能让同文件的新回归被整体跳过。
      - name: Test (unit)
        run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
      - name: Test (all sources)
        if: ${{ !cancelled() }}
        run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Format
        working-directory: native
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      # 新增网络/存储回归不得进入历史豁免；完整 Go 测试失败会阻止发布。
      - name: Vet
        run: go vet ./...
        working-directory: native
      - name: Test
        run: go test -race ./...
        working-directory: native
      - name: Test (all sources)
        if: ${{ !cancelled() }}
        run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
      - name: Native C ABI contract (both editions)
        working-directory: native
        run: |
          go build -buildmode=c-shared -o "$RUNNER_TEMP/duanju-standard.so" ./bridge
          python3 -B ../scripts/check_native_abi.py "$RUNNER_TEMP/duanju-standard.so"
          go build -buildmode=c-shared -ldflags="-X duanjuapp/native/core.buildAllSources=true" -o "$RUNNER_TEMP/duanju-all.so" ./bridge
          python3 -B ../scripts/check_native_abi.py "$RUNNER_TEMP/duanju-all.so" --all-sources
